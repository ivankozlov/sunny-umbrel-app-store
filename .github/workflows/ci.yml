name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check Umbrel package invariants
        run: python scripts/check_package.py
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --pull=false --tag sunny-personal-digest:ci .
