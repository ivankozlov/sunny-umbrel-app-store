name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Cached Chromium needs unprivileged user namespaces for its sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check Umbrel package invariants
        run: python scripts/check_package.py
      - name: Verify security UI with a synthetic authenticator
        env:
          PYTHONPATH: src
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium-headless-shell
          python scripts/check_security_ui.py
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

  image:
    uses: ./.github/workflows/native-security.yml
