name: Native security acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      # Ubuntu 24.04 blocks cached Chromium's sandbox with its userns policy.
      # Supported 22.04 VMs keep the browser sandbox and Docker guards intact.
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: amd64
          - runner: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and browser test tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
          python -m pip install --disable-pip-version-check playwright==1.58.0 pillow==12.3.0
          python -m playwright install --with-deps chromium-headless-shell
      - name: Harden the disposable CI VM core handler
        # Production refuses piped core handlers even with a zero core limit.
        # This changes only this GitHub VM; it never runs on the owner's Umbrel.
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Build actual production image on its native architecture
        run: docker build --pull=false --tag sunny-personal-digest:native-gate .
      - name: Run native image, crypto, children, migration and UI acceptance
        env:
          NATIVE_ARCHITECTURE: ${{ matrix.architecture }}
          PYTHONPATH: src
        run: |
          python -B scripts/check_native_release.py host \
            --architecture="$NATIVE_ARCHITECTURE" \
            --image=sunny-personal-digest:native-gate \
            --out-dir="$RUNNER_TEMP/sunny-native-acceptance"
