manifestVersion: 1
id: sunny-personal-digest
disabled: false
category: automation
name: Sunny Personal Chats
version: "0.2.15"
tagline: One daily digest and morning read receipts for selected chats
description: >-
  Resolves message links for only the explicitly selected Telegram groups.
  Telegram is touched only in a daily 08:00–09:45 Moscow-time window: the app
  creates one combined digest through OpenRouter over a pinned SSH connection,
  then marks those groups read up to their latest message once, leaving mention
  badges in place. Outside the window it only checks the receiver connection
  every 5 minutes. Mentions are not forwarded to Sunny.


  Telegram and provider credentials are deliberately excluded from Umbrel
  backups. A restored config requires manual confirmation that the previous
  Telegram device was terminated before reauthorization. Installation is enabled
  only after a public multi-architecture GHCR image has been published, verified,
  and pinned by immutable digest.
releaseNotes: >-
  Each digest topic links to its earliest referenced Telegram message.
  Direct links to articles and other materials from all referenced messages
  are preserved and deduplicated. The daily schedule, sender-name restoration,
  mention badges, and collector wire protocol 0.2.1 are unchanged.
developer: Ivan Kozlov
website: https://github.com/ivankozlov/sunny-umbrel-app-store
dependencies: []
repo: https://github.com/ivankozlov/sunny-umbrel-app-store
support: https://github.com/ivankozlov/sunny-umbrel-app-store/issues

port: 42831
icon: https://raw.githubusercontent.com/ivankozlov/sunny-umbrel-app-store/main/sunny-personal-digest/icon.svg
gallery: []
path: ""

defaultUsername: sunny
deterministicPassword: true
defaultShell: collector
submitter: Ivan Kozlov

backupIgnore:
  - data/private/*
  - data/private/.*
  - data/runtime/*
  - data/runtime/.*
  - data/config/pending-upload.json
  - data/config/.pending-upload.json.*
  - data/config/pending-monitor-upload.json
  - data/config/.pending-monitor-upload.json.*
