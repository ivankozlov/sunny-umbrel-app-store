manifestVersion: 1
id: sunny-personal-digest
disabled: false
category: automation
name: Sunny Personal Chats
version: "0.2.0"
tagline: Mentions, read receipts, and one digest for selected chats
description: >-
  Watches only the explicitly selected Telegram groups, clears their unread
  state about once a minute, forwards bounded native-mention snippets to Sunny,
  and creates one combined daily digest through OpenRouter over a pinned SSH
  connection.


  Telegram and provider credentials are deliberately excluded from Umbrel
  backups. A restored config requires manual confirmation that the previous
  Telegram device was terminated before reauthorization. Installation is enabled
  only after a public multi-architecture GHCR image has been published, verified,
  and pinned by immutable digest.
releaseNotes: >-
  Breaking v0.2 generation: immutable multi-chat selection, explicit first
  activation without historical mention alerts, durable mention-before-read
  ordering, independent monitor/digest chains, and one combined daily digest.

developer: Ivan Kozlov
website: https://github.com/ivankozlov/sunny-umbrel-app-store
dependencies: []
repo: https://github.com/ivankozlov/sunny-umbrel-app-store
support: https://github.com/ivankozlov/sunny-umbrel-app-store/issues

port: 42831
icon: https://raw.githubusercontent.com/ivankozlov/sunny-umbrel-app-store/main/sunny-personal-digest/icon.svg
gallery: []
path: ""

defaultUsername: sunny
deterministicPassword: true
submitter: Ivan Kozlov

backupIgnore:
  - data/private/*
  - data/private/.*
  - data/runtime/*
  - data/runtime/.*
  - data/config/pending-upload.json
  - data/config/.pending-upload.json.*
  - data/config/pending-monitor-upload.json
  - data/config/.pending-monitor-upload.json.*
